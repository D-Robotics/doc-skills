name: CI Check

on:
  pull_request:
    branches: [main]

jobs:
  glossary-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate glossary.json
        run: node scripts/check-glossary.js
